<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>
        <p class="description">Upload an image to extract a beautiful color palette</p>
        
        <div class="upload-container">
            <label for="imageUpload" class="upload-label">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
                </svg>
                <span>Choose an image</span>
            </label>
            <input type="file" id="imageUpload" accept="image/*" hidden>
        </div>
        
        <div class="preview-container hidden">
            <div class="image-preview-wrapper">
                <img id="imagePreview" alt="Uploaded image preview">
            </div>
            <button id="generateBtn">Generate Palette</button>
        </div>
        
        <div class="palette-container hidden">
            <h2>Your Color Palette</h2>
            <div class="palette-colors" id="paletteColors"></div>
            
            <div class="palette-actions">
                <button id="regenerateBtn">Regenerate</button>
                <button id="newImageBtn">New Image</button>
                <button id="copyPaletteBtn">Copy Colors</button>
            </div>
        </div>
    </div>
    
    <script src="script.js" type="module"></script>

</body>
</html>
